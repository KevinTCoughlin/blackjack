[package]
name = "blackjack"
version = "0.1.0"
edition = "2021"
authors = ["Kevin Coughlin"]
description = "A Unix-philosophy blackjack game with stateless CLI"
license = "MIT"
repository = "https://github.com/KevinTCoughlin/blackjack"
keywords = ["blackjack", "cards", "game", "cli"]
categories = ["games", "command-line-utilities"]

[[bin]]
name = "bj"
path = "src/main.rs"

[lib]
name = "blackjack"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.9"
rand_chacha = "0.9"
clap = { version = "4.0", features = ["derive", "color"] }
thiserror = "1.0"
colored = "2.1"

[dev-dependencies]
pretty_assertions = "1.4"
