[package]
name = "blackjack"
version = "0.1.0"
edition = "2021"
authors = ["Kevin Coughlin"]
description = "A Unix-philosophy blackjack game with stateless CLI"
license = "MIT"
repository = "https://github.com/KevinTCoughlin/blackjack"
keywords = ["blackjack", "cards", "game", "cli"]
categories = ["games", "command-line-utilities"]

[[bin]]
name = "bj"
path = "src/main.rs"

[lib]
name = "blackjack"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
rand = "0.10"
rand_chacha = "0.10"
clap = { version = "4.0", features = ["derive", "color"] }
thiserror = "2.0"
colored = "3.1"

[dev-dependencies]
pretty_assertions = "1.4"
